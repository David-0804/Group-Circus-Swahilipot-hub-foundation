services:
  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: Nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: Nexus_db
      POSTGRES_USER: Nexus_user
      POSTGRES_PASSWORD: Nexus_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Nexus_user -d Nexus_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: Nexus_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: Nexus_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: Nexus_minio_user
      MINIO_ROOT_PASSWORD: Nexus_minio_password_2026
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # ── Django Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: Nexus_backend
    restart: unless-stopped
    environment:
      SECRET_KEY: Nexus-super-secret-key-change-in-production-2026
      DEBUG: "True"
      DB_NAME: Nexus_db
      DB_USER: Nexus_user
      DB_PASSWORD: Nexus_secure_password_2026
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      USE_S3: "False"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: "Nexus System <noreply@Nexus.system>"
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput --clear &&
        gunicorn Nexus.wsgi:application
          --bind 0.0.0.0:8000
          --workers 2
          --timeout 120
          --access-logfile -
          --error-logfile -
      "

  # ── Celery Worker ─────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: Nexus_celery
    restart: unless-stopped
    environment:
      SECRET_KEY: Nexus-super-secret-key-change-in-production-2026
      DEBUG: "True"
      DB_NAME: Nexus_db
      DB_USER: Nexus_user
      DB_PASSWORD: Nobody@#$123
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
      - db
    command: celery -A Nexus worker --loglevel=info --concurrency=2

  # ── Celery Beat ───────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: Nexus_celery_beat
    restart: unless-stopped
    environment:
      SECRET_KEY: Nexus-super-secret-key-change-in-production-2026
      DEBUG: "True"
      DB_NAME: Nexus_db
      DB_USER: Nexus_user
      DB_PASSWORD: Nobody@#$123
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: celery -A Nexus beat --loglevel=info

  # ── React Frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: Nexus_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://127.0.0.1:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_static:
  backend_media:
